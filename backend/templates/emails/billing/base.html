<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ title }}</title></head>
<body style="margin:0;padding:0;background-color:#080C14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#080C14;padding:36px 12px;"><tr><td align="center">
<table role="presentation" width="100%" style="max-width:580px;background-color:#0F172A;border:1px solid #1E293B;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,0.55);overflow:hidden;border-collapse:separate;border-spacing:0;">
<tr><td height="3" style="background:linear-gradient(90deg, #00D2FF 0%, #0066FF 50%, #2563EB 100%);background-color:#0066FF;line-height:3px;font-size:3px;">&nbsp;</td></tr>
<tr><td style="padding:26px 28px 20px;background-color:#0B0F17;border-bottom:1px solid #1E293B;"><table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"><tr><td><a href="https://mail-flow.annomous.com" target="_blank" style="text-decoration:none;display:inline-block;"><img src="{{ logo_url|default_if_none:'' }}" alt="Mail Flow" width="145" height="auto" style="display:block;max-width:145px;height:auto;border:0;" /></a></td></tr></table></td></tr>
<tr><td style="padding:28px 28px 22px;background-color:#0F172A;">
{% if badge %}<div style="display:inline-block;background:rgba(0,102,255,0.12);color:#38bdf8;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 11px;border-radius:9999px;margin-bottom:14px;border:1px solid rgba(56,189,248,0.3);">{{ badge }}</div>{% endif %}
<h1 style="font-size:20px;font-weight:700;margin:0 0 12px;color:#F8FAFC;line-height:1.35;">{{ title }}</h1><p style="font-size:14px;line-height:1.6;color:#94A3B8;margin:0 0 16px;">{{ intro }}</p>
{{ custom_content }}
{% if rows %}<table role="presentation" style="width:100%;max-width:100%;border-collapse:collapse;margin:18px 0;border:1px solid #1e293b;border-radius:8px;overflow:hidden;background-color:#0b0f17;">{% for row in rows %}<tr style="background-color:{% if row.dark %}#0b0f17{% else %}#0f172a{% endif %};"><td style="padding:11px 16px;color:#64748b;font-size:13px;font-weight:500;width:38%;vertical-align:top;{% if row.last %}border-bottom:none;{% else %}border-bottom:1px solid #1e293b;{% endif %}word-break:break-word;">{{ row.label }}</td><td style="padding:11px 16px;color:{% if row.accent %}#38bdf8{% else %}#f1f5f9{% endif %};font-size:13px;font-weight:600;vertical-align:top;{% if row.last %}border-bottom:none;{% else %}border-bottom:1px solid #1e293b;{% endif %}word-break:break-word;overflow-wrap:anywhere;">{{ row.value }}</td></tr>{% endfor %}</table>{% endif %}
{% if cta_url and cta_label %}<table role="presentation" style="margin:24px 0 16px;border-collapse:collapse;"><tr><td align="center" style="border-radius:8px;background-color:#0066FF;"><a href="{{ cta_url }}" target="_blank" style="background-color:#0066FF;color:#ffffff;text-decoration:none;padding:13px 26px;border-radius:8px;display:inline-block;font-weight:600;font-size:14px;letter-spacing:0.01em;box-shadow:0 4px 14px rgba(0,102,255,0.35);">&rarr; {{ cta_label }}</a></td></tr></table>{% endif %}
</td></tr>
<tr><td style="background-color:#080C14;padding:20px 28px;border-top:1px solid #1E293B;"><table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:middle;padding-right:12px;width:32px;"><img src="{{ mark_url|default_if_none:'' }}" alt="" width="24" height="24" style="display:block;border:0;border-radius:4px;opacity:0.95;" /></td><td style="vertical-align:middle;"><p style="margin:0;font-size:12px;color:#64748B;line-height:1.5;">{{ footer_note }}</p><p style="margin:4px 0 0;font-size:11px;color:#475569;">&copy; Mail Flow. All rights reserved.</p></td></tr></table></td></tr>
</table></td></tr></table></body></html>
